[project]
name = "iaedu-openai-adapter"
version = "0.1.0"
description = "OpenAI-compatible FastAPI proxy for IAedu agent streams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
iaedu-openai-adapter = "iaedu_openai_adapter.proxy:main"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/iaedu_openai_adapter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
