services:
  iaedu-openai-adapter:
    build: .
    # image: kimus/iaedu-openai-adapter:latest
    ports:
      - "3067:3067"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3067/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s